# ---------------------------------------------------------------------------
# Serving the built app.
#
# Three rules do all the work:
#   * hashed assets are immutable and cached for a year
#   * the service worker and the shell are never cached, so a deploy is picked up
#   * every other path falls back to the shell, because routing is client-side
#
# Note the repeated `include security-headers.conf`: nginx's `add_header` in a
# location *replaces* the inherited set rather than adding to it, so a header
# declared once at server level would silently vanish from every location that
# sets a cache header. Including the snippet everywhere is the only version of
# this file that actually ships the headers it claims to.
# ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite writes content-hashed filenames, so these can never go stale.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # A cached worker would pin an old app on a device for as long as it lived.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # The broadcast overlay is embedded in streaming software, which loads it in a
    # frame of its own, so it is the one page that opts out of SAMEORIGIN. It
    # carries no session and no controls, so there is nothing to click-jack.
    location ~ ^/s/[^/]+/overlay$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Phone broadcast studio needs camera/mic; keep frame isolation for the app shell.
    location ~ ^/app/matches/[^/]+/broadcast$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
