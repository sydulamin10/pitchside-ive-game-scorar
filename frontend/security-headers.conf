# Included from every location in nginx.conf. See the note there about why this
# is a snippet rather than a single declaration at server level.
#
# There is no Content-Security-Policy header here on purpose: the app is served
# from one origin and talks to exactly one API, so the policy depends on the
# deployment's API origin. Set it at the edge (or add it here) as:
#
#   default-src 'self'; connect-src 'self' https://api.example.com;
#   img-src 'self' data: https:; style-src 'self' 'unsafe-inline';
#   font-src 'self'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'
#
# `style-src 'unsafe-inline'` is required by the inline styles the split-flap
# board and the overlay's team colour use. Everything else is strict.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
