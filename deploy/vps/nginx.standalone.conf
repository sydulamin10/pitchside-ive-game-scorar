map $http_cf_connecting_ip $odcc_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name odcc.live www.odcc.live api.odcc.live;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name odcc.live www.odcc.live;

    ssl_certificate     /etc/letsencrypt/live/odcc.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odcc.live/privkey.pem;
    ssl_session_cache   shared:SSL_ODCCWEB:10m;
    ssl_session_timeout 1h;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/odcc-live;
    index index.html;

    if ($host = www.odcc.live) {
        return 301 https://odcc.live$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location ~* ^/assets/.+\.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/s/[^/]+/overlay {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.odcc.live;

    ssl_certificate     /etc/letsencrypt/live/api.odcc.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.odcc.live/privkey.pem;
    ssl_session_cache   shared:SSL_ODCC:10m;
    ssl_session_timeout 1h;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $odcc_api http://odcc-api:8000;
    set $odcc_mtx http://odcc-mediamtx:8889;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location ^~ /live/ {
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass $odcc_mtx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $odcc_client_ip;
        proxy_set_header X-Forwarded-For $odcc_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_redirect / /live/;
        proxy_redirect http://$host/ /live/;
        proxy_redirect https://$host/ /live/;
        proxy_redirect http://odcc-mediamtx:8889/ /live/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ^~ /api/v1/stream/ {
        proxy_pass $odcc_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $odcc_client_ip;
        proxy_set_header X-Forwarded-For $odcc_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    location / {
        proxy_pass $odcc_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $odcc_client_ip;
        proxy_set_header X-Forwarded-For $odcc_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
