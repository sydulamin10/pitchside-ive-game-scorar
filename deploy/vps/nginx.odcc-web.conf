# ---------------------------------------------------------------------------
# ODCC LIVE web app - odcc.live (static SPA build).
#
# Additive include. Declares no default_server, so default.conf keeps every
# request whose Host is not odcc.live / www.odcc.live, and the co-hosted
# cbg-tasks.duckdns.org task manager is unaffected.
#
# The app talks to https://api.odcc.live cross-origin (see runtime-config.js),
# which the API permits via CORS. Nothing is proxied from this block, so the
# live-score SSE stream is never buffered by an intermediate hop here.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name odcc.live www.odcc.live;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://odcc.live$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    # www is served here too so it does not fall through to the default server.
    # The origin certificate covers only the apex; that is fine while Cloudflare
    # terminates TLS for visitors. Add a www DNS record and re-run certbot with
    # `-d odcc.live -d www.odcc.live` to cover it at the origin as well.
    server_name odcc.live www.odcc.live;

    ssl_certificate     /etc/letsencrypt/live/odcc.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odcc.live/privkey.pem;
    ssl_session_cache   shared:SSL_ODCCWEB:10m;
    ssl_session_timeout 1h;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/odcc-live;
    index index.html;

    access_log /var/log/nginx/odcc-web.access.log;
    error_log  /var/log/nginx/odcc-web.error.log;

    # Canonical host, so the PWA and its service worker have one origin.
    if ($host = www.odcc.live) {
        return 301 https://odcc.live$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Hashed filenames, so these can never go stale. No `expires` directive
    # here: it would emit a second, weaker Cache-Control alongside this one.
    location ~* ^/assets/.+\.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Must not stick to an old deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Repoints the app at a different API host without a rebuild, so it must
    # never be cached.
    location = /runtime-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # Never serve dotfiles from the document root.
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    # Client-side routing: any unknown path is a route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Broadcast overlays are embedded as an OBS / YouTube browser source, so
    # they must stay framable while the rest of the app does not.
    location ~ ^/s/[^/]+/overlay {
        try_files $uri $uri/ /index.html;
    }
}
