# ---------------------------------------------------------------------------
# MediaMTX for ODCC LIVE phone-camera WHIP publish.
#
# WHIP HTTP is reached at https://api.odcc.live/live/... through the existing
# Nginx TLS terminator. ICE media uses a new unused port (8189) on the public
# IP — Cloudflare cannot carry WebRTC UDP, so phones connect here directly.
# ---------------------------------------------------------------------------

logLevel: info
logDestinations: [stdout]

# Unused ingest protocols stay off so we do not occupy 1935 / 8888.
# RTSP is internal-only (not published on the host) so ffmpeg can pull
# a WHIP publisher and restream it to YouTube / Facebook.
rtsp: yes
rtspAddress: :8554
rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigins: ["*"]
webrtcTrustedProxies: [172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16, 127.0.0.1]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes
# Public ICE host. Phones cannot use Docker's private address.
webrtcAdditionalHosts: [103.228.134.134]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

pathDefaults:
  source: publisher

paths:
  all_others:
