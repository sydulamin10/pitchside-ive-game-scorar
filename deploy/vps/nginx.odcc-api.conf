# ---------------------------------------------------------------------------
# ODCC LIVE API — api.odcc.live
#
# Additive include in /etc/nginx/conf.d/. It declares no `default_server`, so
# default.conf keeps every request whose Host is not exactly api.odcc.live and
# the cbg-tasks.duckdns.org site is unaffected.
#
# proxy_pass goes through a variable deliberately: that defers DNS resolution
# to request time via Docker's embedded resolver, so a stopped API container
# makes api.odcc.live return 502 instead of preventing nginx from starting and
# taking the co-hosted site down with it.
# ---------------------------------------------------------------------------

# Requests arrive via the Cloudflare proxy, which puts the visitor's address in
# CF-Connecting-IP. Prefer it, and fall back to the peer address for direct
# origin hits, so the API's per-client rate limiting keys on the real visitor
# rather than on a shared Cloudflare edge address.
map $http_cf_connecting_ip $odcc_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name api.odcc.live;

    # Let's Encrypt HTTP-01 — same webroot volume the existing stack uses.
    # Kept on :80 so renewals keep working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.odcc.live;

    ssl_certificate     /etc/letsencrypt/live/api.odcc.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.odcc.live/privkey.pem;
    ssl_session_cache   shared:SSL_ODCC:10m;
    ssl_session_timeout 1h;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $odcc_api http://odcc-api:8000;
    set $odcc_mtx http://odcc-mediamtx:8889;

    # Media uploads are capped at 5 MiB by the API; leave headroom.
    client_max_body_size 10m;

    access_log /var/log/nginx/odcc-api.access.log;
    error_log  /var/log/nginx/odcc-api.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Phone-camera WHIP. The prefix is stripped so MediaMTX sees /path/whip;
    # Location is rewritten back so the browser's follow-up PATCH/DELETE stay
    # under /live/. ICE media itself is UDP/TCP 8189, not this location.
    location ^~ /live/ {
        # Variable proxy_pass does not strip the location prefix. Rewrite so
        # MediaMTX sees /pitchside/.../whip, not /live/pitchside/.../whip.
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass $odcc_mtx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $odcc_client_ip;
        proxy_set_header X-Forwarded-For $odcc_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_redirect / /live/;
        proxy_redirect http://$host/ /live/;
        proxy_redirect https://$host/ /live/;
        proxy_redirect http://odcc-mediamtx:8889/ /live/;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;

        # WHIP is browser → API origin; MediaMTX already emits CORS, but an
        # OPTIONS that never reaches it must still pass preflight.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Live scoring feed (Server-Sent Events). Buffering must be off or the
    # browser sees nothing until the stream ends, and the read timeout has to
    # outlive SSE_MAX_CONNECTION_SECONDS=3600 so nginx is never the component
    # that severs a healthy stream.
    location ^~ /api/v1/stream/ {
        proxy_pass $odcc_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $odcc_client_ip;
        proxy_set_header X-Forwarded-For $odcc_client_ip;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    location / {
        proxy_pass $odcc_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $odcc_client_ip;
        proxy_set_header X-Forwarded-For $odcc_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
