name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: nobody needs the results
# of a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The integration tests run against a real Postgres, because the parts most
    # worth testing — row locks serialising two scorers, ON CONFLICT idempotency,
    # JSONB round-trips — do not exist in SQLite.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pitchside_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy app tests tools

      - name: Migrations apply cleanly from empty
        env:
          ENV: test
          SECRET_KEY: ci-secret-key-long-enough-for-hs256-signing-in-tests
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pitchside_test
        run: alembic upgrade head

      - name: Migrations match the models
        env:
          ENV: test
          SECRET_KEY: ci-secret-key-long-enough-for-hs256-signing-in-tests
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pitchside_test
        # An empty autogenerate means the migration history and the ORM agree.
        # Drift here is how a deployment discovers a missing column at 3pm on a
        # Saturday, so it fails the build instead.
        run: python tools/check_migrations.py

      - name: Tests
        env:
          ENV: test
          SECRET_KEY: ci-secret-key-long-enough-for-hs256-signing-in-tests
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pitchside_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Types
        # `tsc -b` with noEmit set in both project configs: type checking must never
        # drop .js/.d.ts files next to the sources.
        run: npm run typecheck -- --force

      # The same spec/scoring-fixtures.json the Python engine is tested against,
      # so the two implementations cannot drift apart unnoticed.
      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Icons are reproducible
        # The PWA icons are generated, not hand-drawn. If someone edits the
        # generator and forgets to run it, this catches the difference.
        run: |
          node ../scripts/generate-icons.mjs
          git diff --exit-code -- public/icons

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python advisories
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict

      - name: npm advisories
        working-directory: frontend
        # Build-time-only advisories are reported but do not fail the run; a
        # vulnerability that reaches the browser does.
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || echo "::warning::dev-only advisories present"

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: pitchside-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: pitchside-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The API image boots and answers
        run: |
          docker network create pitchside-ci
          docker run -d --name db --network pitchside-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pitchside \
            postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec db pg_isready -U postgres && break
            sleep 2
          done
          docker run -d --name api --network pitchside-ci -p 8000:8000 \
            -e ENV=development \
            -e SECRET_KEY=ci-secret-key-long-enough-for-hs256-signing \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/pitchside \
            -e LOG_JSON=false \
            pitchside-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/api/v1/health/ready
          docker logs api
